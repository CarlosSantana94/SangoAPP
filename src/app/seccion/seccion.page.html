<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" name="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title style="color: black">{{nombreServicio}}</ion-title>
    <ion-buttons slot="primary" (click)="goToCart()" *ngIf="carrito.cantidad > 0">
      <ion-icon slot="icon-only" ios="cart-outline" md="cart-outline"></ion-icon>
      <ion-button>
        <ion-badge style="background-color: #6780ab">{{carrito.cantidad}}</ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Search Bar with (ionInput) event to detect typing -->
  <ion-toolbar>
    <ion-searchbar [(ngModel)]="searchText" (ionInput)="filterOpciones()" placeholder="Buscar Categoria"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let opc of filteredOpciones" (click)="seleccionarOpcionPrenda(opc)">
        <div class="opc-container">
          <div class="opc-background" [ngStyle]="{'background-image': 'url(' + opc.img + ')'}"></div>
          <h2>{{ opc.nombre }}</h2>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
