<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button text="" name="arrow-back-outline"></ion-back-button>
        </ion-buttons>
        <ion-title>
            {{"My_Profile" | translate}}
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <ion-content>
        <div class="form">

            <div class="img_box center_img">
                <img src="{{photoURL}}" class="crop_img">
                <!--                <ion-icon class="zmdi zmdi-camera ion-text-center"></ion-icon>-->
            </div>
            <ion-list lines="none">
                <ion-item lines="none">

                    <div class="item_inner d-flex">
                        <ion-icon class="zmdi zmdi-account ion-text-start"></ion-icon>
                        <div class="input_box">
                            <ion-label position="floating">Nombre</ion-label>
                            <ion-input mode="md" type="name" value="{{nombre}}" readonly="boolean"></ion-input>
                        </div>
                    </div>
                </ion-item>

                <ion-item lines="none">
                    <div class="item_inner d-flex">
                        <ion-icon class="zmdi zmdi-email ion-text-start"></ion-icon>
                        <div class="input_box">
                            <ion-label position="floating">Email</ion-label>
                            <ion-input mode="md" type="email" value="{{email}}" readonly="boolean"></ion-input>
                        </div>
                    </div>
                </ion-item>

               <!-- <ion-item lines="none">
                    <div class="item_inner d-flex">
                        <ion-icon class="zmdi zmdi-smartphone-iphone ion-text-start"></ion-icon>
                        <div class="input_box">
                            <ion-label position="floating">{{'Phone_Number' | translate}}</ion-label>
                            <ion-input mode="md" type="text" value="{{tel}}" readonly="boolean"></ion-input>
                        </div>
                    </div>
                </ion-item>-->
            </ion-list>
        </div>
    </ion-content>
</ion-content>
