<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" icon="arrow-back-outline" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <span class="toolbar-title">Contacto</span>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- Hero -->
  <div class="contact-hero">
    <div class="hero-icon">
      <ion-icon name="headset-outline"></ion-icon>
    </div>
    <span class="hero-title">¿En qué podemos ayudarte?</span>
    <span class="hero-sub">Estamos disponibles de lunes a sábado, 8am – 6pm</span>
  </div>

  <!-- Contact Cards -->
  <div class="contact-list">

    <a class="contact-card" href="tel:+523331221189" style="animation-delay: 0.06s">
      <div class="contact-icon green">
        <ion-icon name="call-outline"></ion-icon>
      </div>
      <div class="contact-body">
        <span class="contact-label">Teléfono</span>
        <span class="contact-value">+52 33-3122-1189</span>
        <span class="contact-hint">Toca para llamar</span>
      </div>
      <ion-icon name="arrow-forward-outline" class="contact-arrow"></ion-icon>
    </a>

    <a class="contact-card" href="mailto:tintoreriaelectronicasango@gmail.com" style="animation-delay: 0.12s">
      <div class="contact-icon blue">
        <ion-icon name="mail-outline"></ion-icon>
      </div>
      <div class="contact-body">
        <span class="contact-label">Correo electrónico</span>
        <span class="contact-value">tintoreriaelectronicasango&#64;gmail.com</span>
        <span class="contact-hint">Toca para enviar email</span>
      </div>
      <ion-icon name="arrow-forward-outline" class="contact-arrow"></ion-icon>
    </a>

    <div class="contact-card static" style="animation-delay: 0.18s">
      <div class="contact-icon amber">
        <ion-icon name="location-outline"></ion-icon>
      </div>
      <div class="contact-body">
        <span class="contact-label">Dirección</span>
        <span class="contact-value">Av Guadalupe 4331</span>
        <span class="contact-value">Cd de los Niños, 45030</span>
        <span class="contact-value">Zapopan, Jalisco</span>
      </div>
    </div>

  </div>

  <div class="bottom-spacer"></div>
</ion-content>
