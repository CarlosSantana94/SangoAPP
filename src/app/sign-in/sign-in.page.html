<ion-content class="ion-padding">
  <!-- Blurred Background -->
  <div class="blurred-background"></div>

  <!-- Logo Section -->
  <div class="logo">
    <img src="assets/imgs/logo_sango.png" alt="Sango Logo" />
  </div>

  <!-- Form Section -->
  <div class="form">
    <div class="quick_signin">
      <h4 class="ion-text-center">Inicio de sesión</h4>
      <ion-row>
        <ion-col size="12">
          <ion-button fill="outline" size="large" expand="block" class="btn google" (click)="loginWithGoogle()">
            <img slot="start" src="assets/imgs/google.png" alt="Google Icon" />
            Iniciar Sesión con Google
          </ion-button>
        </ion-col>
      </ion-row>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <h5 class="ion-text-center" *ngIf="servidor">
    v0.0.4-{{versionAPI}}
    <ion-icon style="color: #29af5d" name="radio-button-on-outline"></ion-icon>
  </h5>
  <h5 class="ion-text-center" *ngIf="!servidor">
    v0.0.4
    <ion-icon style="color: #ed576b" name="radio-button-on-outline"></ion-icon>
  </h5>
</ion-footer>
