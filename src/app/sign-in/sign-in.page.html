<ion-content [fullscreen]="true">

  <!-- Parallax Blurred Background -->
  <div class="parallax-bg" aria-hidden="true">
    <div class="gradient-base"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="parallax-layer"></div>
    <div class="white-veil"></div>
  </div>

  <!-- Page Layout -->
  <div class="signin-layout">

    <!-- Logo -->
    <div class="logo-section">
      <img src="assets/imgs/logo_sango.png" alt="Sango" class="logo-img" />
    </div>

    <!-- Auth Card -->
    <div class="auth-card" *ngIf="servidor">
      <h1 class="auth-title">
        <span class="letter" style="--i:0">B</span><span class="letter" style="--i:1">i</span><span class="letter" style="--i:2">e</span><span class="letter" style="--i:3">n</span><span class="letter" style="--i:4">v</span><span class="letter" style="--i:5">e</span><span class="letter" style="--i:6">n</span><span class="letter" style="--i:7">i</span><span class="letter" style="--i:8">d</span><span class="letter" style="--i:9">o</span>
      </h1>

      <div class="btn-group">

        <!-- Google Sign In -->
        <button class="btn btn-google" (click)="loginWithGoogle()">
          <svg class="g-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Continuar con Google</span>
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span></span>
          <em>o sin cuenta</em>
          <span></span>
        </div>

        <!-- Ver Servicios -->
        <button class="btn btn-services" (click)="verServicios()">
          <ion-icon name="grid-outline"></ion-icon>
          <span>Explorar Servicios</span>
        </button>

      </div>
    </div>

    <!-- Offline State -->
    <div class="offline-state" *ngIf="servidor === false">
      <ion-icon name="cloud-offline-outline"></ion-icon>
      <p>Servicio no disponible</p>
    </div>

  </div>

</ion-content>

<ion-footer class="ion-no-border">
  <div class="version-footer">
    <span class="v-dot online" *ngIf="servidor"></span>
    <span class="v-text" *ngIf="servidor">v2.0 — {{ apiVersion }}</span>
    <span class="v-dot offline" *ngIf="!servidor"></span>
    <span class="v-text" *ngIf="!servidor">v2.0</span>
  </div>
</ion-footer>
