<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" icon="arrow-back-outline" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="breadcrumb">
        <span class="bc-parent">{{ nombreServicio }}</span>
        <ion-icon name="chevron-forward-outline" class="bc-sep"></ion-icon>
        <span class="bc-current">{{ nombreOpcion }}</span>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="page-header">
    <h2 class="page-title">{{ tieneCuenta ? 'Selecciona tus prendas' : 'Prendas disponibles' }}</h2>
  </div>

  <div class="prendas-grid">
    <div
      class="prenda-card"
      *ngFor="let prenda of subPrendas; trackBy: trackByFn; let i = index"
      [style.animation-delay]="(i * 0.06) + 's'"
      [class.has-items]="prenda.cantidad > 0">

      <div class="prenda-img-wrap" (click)="abrirModal(prenda.img)">
        <ion-img [src]="prenda.img" class="prenda-img"></ion-img>
        <div class="img-zoom-hint">
          <ion-icon name="expand-outline"></ion-icon>
        </div>
      </div>

      <div class="prenda-info">
        <h3 class="prenda-name">{{ prenda.nombre }}</h3>
        <p class="prenda-desc" *ngIf="prenda.descripcion">{{ prenda.descripcion }}</p>
        <span class="prenda-price">${{ prenda.precio }}</span>
      </div>

      <div class="qty-row" *ngIf="tieneCuenta">
        <button
          class="qty-btn minus"
          (click)="removerPrenda(prenda)"
          [class.invisible]="!prenda.cantidad">
          <ion-icon name="remove-outline"></ion-icon>
        </button>
        <span class="qty-num" [class.positive]="prenda.cantidad > 0">
          {{ prenda.cantidad || 0 }}
        </span>
        <button class="qty-btn plus" (click)="agregarPrenda(prenda)">
          <ion-icon name="add-outline"></ion-icon>
        </button>
      </div>

    </div>
  </div>

  <div class="bottom-spacer"></div>
</ion-content>

<ion-footer class="ion-no-border" *ngIf="tieneCuenta">
  <div class="footer-bar">
    <div class="footer-left" (click)="goToCart()" *ngIf="totalPrendas > 0">
      <div class="footer-badge">{{ totalPrendas }}</div>
      <span class="footer-items">prendas</span>
    </div>
    <div class="footer-total">${{ total || 0 }}</div>
    <button class="footer-cta" (click)="irAEnvios()" *ngIf="total > 0">
      Continuar
      <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>
  </div>
</ion-footer>
